# /etc/nginx/sites-available/desk.juooa.cloud
# ln -s /etc/nginx/sites-available/desk.juooa.cloud /etc/nginx/sites-enabled/
# certbot --nginx -d desk.juooa.cloud

server {
    listen 80;
    listen [::]:80;
    server_name desk.juooa.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name desk.juooa.cloud;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/desk.juooa.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/desk.juooa.cloud/privkey.pem;

    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed Vite assets — safe to cache hard.
    location /assets/ {
        alias /var/www/iae-desk/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Magic links and the API must never be cached.
    location ~ ^/(api|join)/ {
        proxy_pass http://127.0.0.1:8130;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8130;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
